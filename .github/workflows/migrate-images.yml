name: Migrate Doc Images to R2

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "content/docs/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "上传 R2 并改写引用（不勾选 = dry-run，报告见 job log）"
        type: boolean
        default: false

concurrency:
  group: migrate-images
  cancel-in-progress: false

jobs:
  migrate:
    # 自动提交带 [skip ci]，actor 检查是防循环的第二道保险
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Migrate images
        env:
          APPLY: ${{ (github.event_name == 'push' || inputs.apply) && '1' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node scripts/migrate-images-to-r2.mjs

      - name: Commit rewritten references
        if: github.event_name == 'push' || inputs.apply
        run: |
          if [ -z "$(git status --porcelain content/docs)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/docs
          git commit -m "chore(images): migrate doc images to R2 [skip ci]"
          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
