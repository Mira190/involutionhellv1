name: Translate Docs

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Generate translations and update the translation-sync PR"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: translate-docs
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/translation-sync

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APPLY_RUN: ${{ (github.event_name == 'schedule' || inputs.apply) && '1' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # 手动 apply 缺 secret 要立刻报错；定时运行缺 secret 只跳过，
      # 否则 secret 未 provision 前每周一次红色失败告警会被当噪音忽略
      - name: Require provider secret for APPLY runs
        run: |
          if [ "$APPLY_RUN" = "1" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::notice::ANTHROPIC_API_KEY not provisioned; skipping scheduled translation sync."
              echo "APPLY_RUN=" >> "$GITHUB_ENV"
              echo "SKIP_RUN=1" >> "$GITHUB_ENV"
            else
              echo "::error::ANTHROPIC_API_KEY is required for an APPLY run."
              exit 1
            fi
          fi

      - name: Enable Corepack
        run: corepack enable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Plan or generate changed translations
        run: |
          if [ "$APPLY_RUN" = "1" ]; then
            APPLY=1 TRANSLATE_MAX_UNITS=${{ vars.TRANSLATE_MAX_UNITS || 200 }} pnpm translate:docs
          else
            pnpm translate:docs
          fi

      - name: Quality-gate generated translations
        if: env.APPLY_RUN == '1'
        run: |
          git add -N content/docs
          if git diff --quiet HEAD -- content/docs; then
            echo "no doc changes to gate"
          else
            git diff --name-only HEAD -- content/docs \
              | grep -E '\.(md|mdx)$' \
              | xargs -r -d '\n' pnpm check:translations:quality --strict --changed
          fi

      - name: Stage generated transaction
        if: env.APPLY_RUN == '1'
        run: |
          git add content/docs generated/translation-memory.json generated/translation-conflicts.md

      - name: Validate generated transaction
        if: env.APPLY_RUN == '1'
        run: |
          pnpm test
          pnpm lint
          pnpm typecheck
          pnpm build
          unstaged="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$unstaged" ] || [ -n "$untracked" ]; then
            echo "::error::Validation produced files outside the staged translation transaction."
            printf 'unstaged tracked files:\n%s\n' "$unstaged"
            printf 'untracked files:\n%s\n' "$untracked"
            echo "Fix the non-idempotent generator instead of committing hidden build side effects."
            exit 1
          fi

      - name: Publish or update translation pull request
        if: env.APPLY_RUN == '1'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git commit -m "chore(i18n): incremental translation sync [translation-sync]"

          remote_sha="$(git ls-remote --heads origin "$SYNC_BRANCH" | cut -f1)"
          if [ -n "$remote_sha" ]; then
            git push \
              --force-with-lease="refs/heads/$SYNC_BRANCH:$remote_sha" \
              origin "HEAD:refs/heads/$SYNC_BRANCH"
          else
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

          existing_pr="$(gh pr list \
            --base "$DEFAULT_BRANCH" \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "updated existing translation PR #$existing_pr"
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "chore(i18n): incremental translation sync" \
              --body $'Automated incremental translation update.\n\nThis PR is intentionally reviewable and must pass the repository build, test, typecheck, and translation-quality checks before merge.'
          fi
